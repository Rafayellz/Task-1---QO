<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Viewer</title>
    <style>
        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            background: #ffffff;
            display: flex;
            align-items: stretch;
            justify-content: center;
            padding: 24px;
            font-family: "Segoe UI", Roboto, Arial, sans-serif;
            color: #111827;
        }

        .layout {
            width: min(1200px, 100%);
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-height: calc(100vh - 48px);
        }

        .heading {
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: clamp(1.35rem, 3vw, 1.9rem);
            letter-spacing: 0.1px;
        }

        .subtitle {
            margin: 8px 0 0;
            font-size: 0.96rem;
            color: #4b5563;
        }

        .viewer {
            flex: 1;
            min-height: 520px;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
            background: #f3f4f6;
            border-radius: 10px;
        }

        @media (max-width: 600px) {
            body {
                padding: 16px;
            }

            .layout {
                gap: 12px;
                min-height: calc(100vh - 32px);
            }

            .viewer {
                min-height: 420px;
            }
        }
    </style>
</head>
<body>
    <main class="layout">
        <div class="heading">
            <h1>Task 1 - QO</h1>
            <p class="subtitle">Slides 28–31 under the topic Query Optimization.</p>
        </div>

        <div class="viewer">
            <iframe src="Villar_Task 1 - QO.pdf" title="PDF Viewer"></iframe>
        </div>
    </main>
</body>
</html>
